name: Testes

on:
  push:
    branches:
      - principal
  pull_request:
    branches:
      - principal
  workflow_dispatch:
    inputs:
      origem:
        description: 'De onde vem o delegua-llvm: npm (versão publicada) ou git (repositório)'
        required: false
        default: 'npm'
        type: choice
        options:
          - npm
          - git
      versao:
        description: 'Versão do npm (ex.: ^10.0.1) ou ramo, tag ou commit do git'
        required: false
        default: ''

env:
  LLVM_VERSION_MAJOR: 23
  # Versão do delegua-llvm usada em push e PR.
  DELEGUA_LLVM_NPM: '^10.0.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  testes:
    name: Testes (Linux)
    runs-on: ubuntu-24.04

    env:
      ORIGEM: ${{ github.event.inputs.origem || 'npm' }}
      VERSAO: ${{ github.event.inputs.versao }}

    steps:
      - name: Checkout do pacote-delegua
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: LLVM ${{ env.LLVM_VERSION_MAJOR }}, clang e libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common ninja-build libcurl4-openssl-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION_MAJOR }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-${{ env.LLVM_VERSION_MAJOR }}-dev clang-${{ env.LLVM_VERSION_MAJOR }}
          # Usado pelo llvm-bindings para compilar o módulo nativo durante a instalação.
          echo "LLVM_DIR=/usr/lib/llvm-${{ env.LLVM_VERSION_MAJOR }}/cmake" >> $GITHUB_ENV
          # O delegua-llvm compila o código C com `clang` (e usa o `opt`, se houver).
          sudo ln -sf /usr/bin/clang-${{ env.LLVM_VERSION_MAJOR }} /usr/local/bin/clang
          sudo ln -sf /usr/bin/opt-${{ env.LLVM_VERSION_MAJOR }} /usr/local/bin/opt
          clang --version

      # Padrão: a versão publicada no npm, com o comando `delegua-llvm` que os usuários instalam.
      - name: delegua-llvm do npm
        if: env.ORIGEM == 'npm'
        run: |
          versao="${VERSAO:-$DELEGUA_LLVM_NPM}"
          npm install --prefix "$RUNNER_TEMP/delegua-llvm" --no-audit --no-fund "@designliquido/delegua-llvm@$versao"
          echo "$RUNNER_TEMP/delegua-llvm/node_modules/.bin" >> $GITHUB_PATH

      # Execução manual com origem git: compila o delegua-llvm a partir do repositório, para
      # testar correções ainda não publicadas.
      - name: Checkout do delegua-llvm
        if: env.ORIGEM == 'git'
        uses: actions/checkout@v4
        with:
          repository: DesignLiquido/delegua-llvm
          ref: ${{ github.event.inputs.versao || 'principal' }}
          path: delegua-llvm

      - name: delegua-llvm do git
        if: env.ORIGEM == 'git'
        working-directory: delegua-llvm
        run: |
          yarn install --frozen-lockfile
          yarn empacotar
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec node "%s/dist/ilc.js" "$@"\n' "$PWD" > "$RUNNER_TEMP/bin/delegua-llvm"
          chmod +x "$RUNNER_TEMP/bin/delegua-llvm"
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH

      - name: Versão do delegua-llvm
        run: |
          command -v delegua-llvm
          if [ "$ORIGEM" = "npm" ]; then
            npm ls --prefix "$RUNNER_TEMP/delegua-llvm" @designliquido/delegua-llvm
          else
            git -C delegua-llvm log --oneline -1
          fi

      - name: Testes
        run: testes/executar.sh

      - name: Compilação do programa pacote
        run: |
          delegua-llvm fontes/pacote.delegua -o pacote
          PACOTECA_URL=http://127.0.0.1:1 fontes/pacote --help | head -1
